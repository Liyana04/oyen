<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oyen - Pixel Cat Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="script.css">

<body class="bg-[#a0d2eb] flex justify-center items-center min-h-screen touch-manipulation select-none">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NQ88T6LJ"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="game-wrapper" class="relative w-full max-w-5xl mx-auto h-[85vh] sm:h-auto sm:aspect-[2/1] bg-sky-300 overflow-hidden shadow-2xl border-4 sm:border-8 border-[#2d2d2d] image-rendering-pixelated rounded-lg sm:rounded-none">
        
        <!-- The Game Canvas -->
        <canvas id="gameCanvas" width="800" height="400" class="w-full h-full block bg-sky-300"></canvas>

        <!-- MENU SCREEN (Journey step 2) -->
        <div id="menu-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-[#2B3856]/80 backdrop-blur-sm z-20 font-pixel text-white">
                <div class="bg-[#2B3856] p-4 sm:p-6 rounded-xl border-4 border-gray-400 flex flex-col items-center gap-3 sm:gap-4 w-[92%] max-w-sm max-h-[100%] overflow-y-auto text-center shadow-[inset_0_0_20px_rgba(255,255,255,0.1)]">
                <div class="bg-white text-[#2B3856] font-bold px-4 py-1 rounded w-full">Kucing Adventure</div>
                <!-- <input id="player-name" type="text" maxlength="10" class="bg-transparent border-b-2 border-white text-center text-lg outline-none w-full placeholder-gray-400 text-white transition-colors focus:border-yellow-300" placeholder="My Name"> -->
                
                <div class="mt-2 text-sm text-gray-300">CHOOSE YOUR CAT</div>
                <div class="flex gap-6 mt-1">
                    <div class="flex flex-col items-center cursor-pointer" onclick="selectCat('orange')">
                        <img src="images/oyen.png" class="w-16 h-auto object-contain border-2 border-transparent rounded hover:border-yellow-400 transition" id="cat-orange-btn">
                        <span class="text-xs mt-1">Oyen</span>
                    </div>
                    <div class="flex flex-col items-center cursor-pointer" onclick="selectCat('grey')">
                        <img src="images/oyem.png" class="w-16 h-auto object-contain border-2 border-transparent rounded hover:border-yellow-400 transition" id="cat-grey-btn">
                        <span class="text-xs mt-1">Onyet</span>
                    </div>
                </div>
                
                <button onclick="startGame()" class="mt-3 bg-white text-[#2B3856] px-8 py-2 font-bold hover:bg-gray-200 transition active:scale-95 shadow-md">START ADVENTURE</button>
            </div>
        </div>

        <!-- Instruction Modal (Tighter Vertical Spacing) -->
        <div id="instruction-modal" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/40 backdrop-blur-[2px] hidden pointer-events-auto p-4 font-pixel text-white select-none cursor-pointer">
            
            <!-- Outer Card Wrapper -->
            <div class="flex flex-col items-center justify-between h-full max-h-[460px] py-2">
                
                <!-- Top Header & Instructions List -->
                <div class="flex flex-col items-center text-center space-y-1.5 drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)]">
                    <h2 class="text-xl sm:text-2xl font-bold tracking-widest text-white mb-1">HOW TO PLAY</h2>
                    
                    <ul class="text-[0.65rem] sm:text-xs space-y-1 text-gray-100 max-w-md leading-relaxed">
                        <li>- dodge obstacles along the path</li>
                        <li>- collect food to earn points (+3)</li>
                        <li>- reach 69 points to win the game</li>
                    </ul>
                </div>

                <!-- Center Player Sprite Preview -->
                <div class="flex flex-col items-center my-2">
                    <img id="modal-cat-preview" src="images/oyen.png" class="w-10 h-10 object-contain drop-shadow-md animate-bounce mb-1">
                    <div class="w-16 h-1 bg-pink-500 rounded-full shadow-lg"></div>
                </div>

                <!-- Bottom Controls & Press Any Key Prompt -->
                <div class="flex flex-col items-center text-center space-y-2 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
                    <!-- Key Pills -->
                    <div class="flex items-center gap-2 text-black text-[0.65rem] font-bold">
                        <span class="bg-white px-2.5 py-0.5 rounded border border-black shadow">spacebar</span>
                        <span class="bg-white px-1.5 py-0.5 rounded border border-black shadow">⬅️</span>
                        <span class="bg-white px-1.5 py-0.5 rounded border border-black shadow">➡️</span>
                    </div>
                    
                    <!-- Press Any Key Text -->
                    <p class="text-[0.65rem] sm:text-xs text-gray-200 animate-pulse tracking-wide">
                        press any key or tap to continue
                    </p>
                </div>

            </div>
        </div>

        <!-- HUD (Journey step 3) -->
        <div class="absolute top-3 right-3 z-30 flex items-center gap-2">
            <div id="hud" class="top-3 right-3 z-30 font-pixel text-xs hidden px-4 py-2 rounded-lg bg-white/95 border-2 border-[#2B3856] shadow-lg flex items-center gap-3 pointer-events-auto">
                <span id="player-name-display" class="text-[#2B3856]"></span>
                <span id="score-display" class="text-[#2B3856] font-bold">0</span>
            </div>
            <div class="flex items-center gap-2">
             <button id="mute-btn" onclick="toggleMute()" class="pointer-events-auto bg-black/50 hover:bg-black/70 text-base p-1.5 rounded transition">🔊</button>
            </div>
        </div>

        <!-- GAME OVER SCREEN (Journey step 7 & 6) -->
        <div id="gameover-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 backdrop-blur-sm z-20 hidden font-pixel text-white text-center p-4">
            <h1 class="text-3xl sm:text-4xl text-red-500 font-bold mb-6 drop-shadow-[0_0_15px_rgba(255,0,0,0.5)]">GAME OVER</h1>
            <div class="flex gap-4">
                <button onclick="restartGame()" class="bg-white text-black px-6 py-3 hover:bg-gray-200 active:scale-95 shadow-md rounded">REPLAY</button>
                <button onclick="window.open('https://www.linkedin.com/in/nur-liyana-aris/','_blank')" class="bg-blue-600 text-white px-6 py-3 hover:bg-blue-700 active:scale-95 shadow-md rounded">LINKEDIN</button>
            </div>
        </div>

<!-- WIN SCREEN (Journey step 6) -->
        <div id="win-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-green-900/90 backdrop-blur-sm z-20 hidden font-pixel text-white">
            <!-- INNER WRAPPER CARD -->
            <div class="bg-[#1b4332] p-4 sm:p-6 rounded-xl border-4 border-gray-400 flex flex-col items-center gap-3 sm:gap-4 shadow-[inset_0_0_20px_rgba(255,255,255,0.1)]">
                <h1 class="text-yellow-300 font-bold drop-shadow-[0_0_10px_rgba(255,255,0,0.6)]">CONGRATULATIONS!</h1>
                
                <!-- CATS + TEXT ROW WITH character-preview CLASS -->
                <div class="character-preview my-2">
                    <img src="images/oyen.png" class="w-12 h-auto object-contain">
                    <span class="text-xl">YOU WIN!</span>
                    <img src="images/oyem.png" class="w-12 h-auto object-contain">
                </div>

                <div class="flex gap-3">
                    <button onclick="restartGame()" class="bg-white text-black hover:bg-gray-200 active:scale-95 shadow-md rounded">REPLAY</button>
                    <button onclick="window.open('https://www.linkedin.com/in/nur-liyana-aris/','_blank')" class="bg-blue-600 text-white hover:bg-blue-700 active:scale-95 shadow-md rounded">LINKEDIN</button>
                </div>
            </div>
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
